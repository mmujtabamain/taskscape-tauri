<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskscape</title>
    <style>
      /* Paint the themed page background on the very first frame — before the
         app's CSS/JS load — so the always-visible window never flashes white
         while the webview boots. In the lowest cascade layer so index.css's
         own `.dark`-driven background wins the moment it loads (which also
         corrects an explicit theme override that differs from the system).
         The --boot-* vars are pre-CSS stand-ins for the design tokens the
         #boot indicator uses; once tokens.css loads, the real theme-swapping
         aliases (--surface-1 / --edge-3 / --content-3) take over via the
         var() fallback chain below. */
      @layer app-boot {
        :root {
          --boot-bg: oklch(0.968 0.002 255);
          --boot-edge: oklch(0.32 0.02 260 / 0.3);
          --boot-ink: oklch(0.62 0.013 264);
          background-color: var(--boot-bg);
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --boot-bg: oklch(0.205 0.004 260);
            --boot-edge: oklch(0.98 0.01 260 / 0.24);
            --boot-ink: oklch(0.57 0.011 262);
          }
        }
      }

      /* Startup indicator: a checkbox quietly ticking itself, echoing the
         task-row check-draw animation. The native window draws the same empty
         box (panels.rs) before this page paints, and this #boot box covers it
         at the identical position — so the box is on screen from the window's
         first frame and the tick starts the moment the webview has loaded.
         #boot is a blurred veil over the mounting app; lib/boot.ts dismisses
         it once the full load (DB open + data) lands, fading the whole veil
         out so the content behind comes into focus rather than cross-fading.

         Reduced-motion exemption: this loading choreography is brief, one-shot
         startup feedback, so it plays even under "Reduce Motion" / Low Power
         Mode — which tokens.css otherwise neutralizes by clamping every
         animation/transition duration to ~0 (`* { … !important }`, via both the
         prefers-reduced-motion media query and the `.reduced-motion` class).
         The two CSS animations here — the tick and #root's content fade —
         survive because they carry `!important` at id-level specificity
         (`#boot …` / `#root …`), out-weighing those universal-selector rules.
         The veil fade is driven from lib/boot.ts via the Web Animations API,
         which isn't a CSS transition so the clamp never touches it (a plain CSS
         transition here loses to the clamp regardless of !important). */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: color-mix(
          in oklab,
          var(--surface-1, var(--boot-bg)) 62%,
          transparent
        );
        -webkit-backdrop-filter: blur(20px);
        backdrop-filter: blur(20px);
      }

      /* The app content materializes behind the veil instead of popping in:
         invisible while #root is empty, a soft fade once React mounts. */
      #root:empty {
        opacity: 0;
      }
      #root:not(:empty) {
        animation: app-in 1000ms cubic-bezier(0.2, 0, 0, 1) both !important;
      }
      @keyframes app-in {
        from {
          opacity: 0;
        }
      }
      /* Keep the title-bar strip draggable while the overlay is up (h-13). */
      .boot-drag {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 52px;
      }
      .boot-box {
        stroke: var(--edge-3, var(--boot-edge));
      }
      #boot .boot-tick {
        stroke: var(--content-3, var(--boot-ink));
        stroke-dasharray: 18;
        animation: boot-tick 1.7s cubic-bezier(0.2, 0, 0, 1) infinite !important;
      }
      @keyframes boot-tick {
        0% {
          stroke-dashoffset: 18;
          opacity: 1;
        }
        38% {
          stroke-dashoffset: 0;
        }
        62% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        80% {
          opacity: 0;
        }
        100% {
          stroke-dashoffset: 18;
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-label="Loading Taskscape">
      <div class="boot-drag" data-tauri-drag-region></div>
      <svg class="boot-check" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <rect class="boot-box" x="1.5" y="1.5" width="25" height="25" rx="7" fill="none" stroke-width="1.5" />
        <path class="boot-tick" d="M8.2 14.6 L12.4 18.6 L19.8 9.9" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
