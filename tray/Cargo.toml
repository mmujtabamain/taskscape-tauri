[package]
name = "taskscape-tray"
version = "0.1.0"
edition = "2021"
description = "Taskscape's always-on menu-bar capture agent (Slint mini bar)"

[[bin]]
name = "taskscape-tray"
path = "src/main.rs"

[build-dependencies]
slint-build = "1"

[dependencies]
slint = { version = "1", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = "0.24"
global-hotkey = "0.8"
taskscape-common = { path = "../common" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
