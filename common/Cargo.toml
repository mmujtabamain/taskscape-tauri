[package]
name = "taskscape-common"
version = "0.1.0"
edition = "2021"
description = "Shared endpoints, storage, screenshot and attachment utilities for Taskscape"

[lib]
name = "taskscape_common"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
