[package]
name = "taskscape-common"
version = "0.1.0"
edition = "2021"
description = "Shared endpoints, storage, screenshot and attachment utilities for Taskscape"

[lib]
name = "taskscape_common"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
# Direct handle to SeaORM's own SQLite driver so we can build a pool whose every
# connection has WAL + busy_timeout + foreign_keys set (SeaORM's ConnectOptions
# can't set per-connection SQLite pragmas). Unified to one 0.8.x with SeaORM.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
include_dir = "0.7"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
